<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Book Scanner — pipeline bench harness</title>
  </head>
  <body>
    <p>Dev-only harness. <code>npm run benchmark</code> drives this page with Playwright.</p>
    <pre id="log"></pre>
    <script type="module">
      import { prepare } from '/src/pipeline/preprocess.ts'
      import { TesseractPool, readImage } from '/src/pipeline/ocr.ts'
      import {
        createGeminiClient,
        evidenceFromAi,
        readWithAi,
      } from '/src/pipeline/ai-ocr.ts'
      import {
        detect,
        groupLines,
        hypotheses,
        isNoise,
        tallestLineHeight,
      } from '/src/pipeline/candidates.ts'
      import { identify } from '/src/pipeline/identify.ts'
      import { createLookupCache } from '/src/storage/db.ts'

      // Shared across the whole benchmark run so repeated queries do not hammer the API.
      const lookupCache = createLookupCache()

      /** Photographic degradation, so the numbers reflect phone photos, not clean artwork. */
      async function degrade(blob, { rotate = 3, blur = 0.6, darken = 0.85, quality = 0.4 } = {}) {
        const bitmap = await createImageBitmap(blob)
        const canvas = document.createElement('canvas')
        canvas.width = bitmap.width
        canvas.height = bitmap.height
        const ctx = canvas.getContext('2d')
        ctx.filter = `blur(${blur}px) brightness(${darken})`
        ctx.translate(canvas.width / 2, canvas.height / 2)
        ctx.rotate((rotate * Math.PI) / 180)
        ctx.drawImage(bitmap, -bitmap.width / 2, -bitmap.height / 2)
        bitmap.close()
        return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality))
      }

      function base64ToBlob(base64, type = 'application/octet-stream') {
        const binary = atob(base64)
        const bytes = new Uint8Array(binary.length)
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i)
        return new Blob([bytes], { type })
      }

      let pool = null
      let aiClient = null

      window.bench = {
        async init(languages = ['eng'], paths = {}) {
          pool = await TesseractPool.create(languages, 1, undefined, paths)
          return true
        },
        /** `--ai` does not need tesseract at all, so the pool is never created for it. */
        initAi(apiKey, model) {
          aiClient = createGeminiClient(model ? { apiKey, model } : { apiKey })
          return true
        },
        /**
         * The Gemini path, measured through exactly the code the app runs: the same
         * prompt, the same defensive parsing, and the same catalogue step afterwards.
         */
        async runAi(base64, options = {}) {
          const blob = base64ToBlob(base64, options.type)
          const started = performance.now()
          // The resized colour frame, not the binarised one — the same choice the app
          // makes, produced the same way, so the benchmark measures what actually ships.
          const prepared = await prepare(blob, undefined, undefined, { aiFrame: true })
          const jpeg = prepared.aiFrame
          let detection
          let rawText = ''
          let failed
          try {
            const outcome = await readWithAi(aiClient, jpeg)
            detection = outcome.detection
            rawText = outcome.rawText
          } catch (err) {
            // Recorded rather than thrown: a run of 18 covers should not be lost to one
            // rate-limited request, and the report needs to show which covers failed.
            failed = err?.kind ? `${err.kind}: ${err.message}` : String(err)
            detection = {
              title: '',
              author: '',
              confidence: 0,
              reason: 'The AI call failed.',
              titleAlternates: [],
              authorAlternates: [],
              source: 'ai',
            }
          }
          if (options.lookup && !failed) {
            const { result, ranked } = evidenceFromAi(rawText, detection)
            const outcome = await identify(result, ranked, detection, { cache: lookupCache })
            detection = outcome.detection
          }
          return {
            ...detection,
            failed,
            ms: Math.round(performance.now() - started),
            meanConfidence: detection.confidence,
            lineCount: rawText.split('\n').filter(Boolean).length,
            thumbnailBytes: prepared.thumbnail.size,
            rawText,
          }
        },
        async run(base64, options = {}) {
          let blob = base64ToBlob(base64, options.type)
          if (options.degrade) blob = await degrade(blob, options.degrade)
          const started = performance.now()
          const prepared = await prepare(blob)
          const ocr = await readImage(pool, prepared)
          let detection = detect(ocr)
          let lookup
          if (options.lookup) {
            const outcome = await identify(ocr, hypotheses(ocr), detection, { cache: lookupCache })
            lookup = {
              query: outcome.queries.join(' | '),
              matched: outcome.matched,
              error: outcome.error,
              ranked: outcome.ranked.map((s) => ({
                title: s.doc.title,
                author: s.doc.author_name?.[0],
                t: Number(s.titleSupport.toFixed(2)),
                a: Number(s.authorSupport.toFixed(2)),
                ok: s.accepted,
              })),
            }
            detection = outcome.detection
          }
          return {
            ...detection,
            lookup,
            ms: Math.round(performance.now() - started),
            meanConfidence: Math.round(ocr.meanConfidence),
            lineCount: ocr.lines.length,
            passes: (ocr.passes ?? []).map((p) => `${p.variant}/${p.psm}`),
            thumbnailBytes: prepared.thumbnail.size,
            rawText: ocr.text,
          }
        },
        /** Per-cover dump: every line OCR read, and every candidate that survived. */
        async diagnose(base64, options = {}) {
          const blob = base64ToBlob(base64, options.type)
          const prepared = await prepare(blob)
          const ocr = await readImage(pool, prepared)
          const pageMax = tallestLineHeight(ocr.lines)
          return {
            size: [ocr.width, ocr.height],
            pageMax: Math.round(pageMax),
            lines: ocr.lines.map((l) => ({
              text: l.text,
              conf: Math.round(l.confidence),
              h: Math.round(
                l.words.length
                  ? l.words.map((w) => w.bbox.y1 - w.bbox.y0).sort((a, b) => a - b)[
                      Math.floor(l.words.length / 2)
                    ]
                  : l.bbox.y1 - l.bbox.y0,
              ),
              y: l.bbox.y0,
              noise: isNoise(l.text),
            })),
            candidates: groupLines(ocr.lines, ocr.height).map((c) => ({
              text: c.text,
              h: Math.round(c.height),
              rel: Number((c.height / Math.max(1, pageMax)).toFixed(2)),
              conf: Math.round(c.confidence),
            })),
            hypotheses: hypotheses(ocr).map((h) => ({
              t: h.title,
              a: h.author,
              s: Number(h.score.toFixed(2)),
            })),
          }
        },
        async smallProbe(base64) {
          const blob = base64ToBlob(base64, 'image/jpeg')
          const prepared = await prepare(blob)
          const out = []
          for (const variant of ['small', 'smallGray']) {
            for (const psm of [3, 6, 11, 12]) {
              const ocr = await pool.recognise(prepared[variant], psm, 300)
              out.push({
                variant,
                psm,
                size: [prepared[variant].width, prepared[variant].height],
                lines: ocr.lines
                  .slice()
                  .sort((a, b) => b.confidence - a.confidence)
                  .slice(0, 5)
                  .map((l) => l.text + ' [' + Math.round(l.confidence) + ']'),
              })
            }
          }
          return out
        },
        async passes(base64) {
          const blob = base64ToBlob(base64, 'image/jpeg')
          const prepared = await prepare(blob)
          const ocr = await readImage(pool, prepared)
          return ocr.passes.map((p) => ({
            variant: p.variant,
            psm: p.psm,
            size: [p.width, p.height],
            lines: p.lines
              .slice()
              .sort((a, b) => b.confidence - a.confidence)
              .slice(0, 8)
              .map((l) => l.text + ' [' + Math.round(l.confidence) + ']'),
          }))
        },
        async sizeProbe(base64, longEdges) {
          const blob = base64ToBlob(base64, 'image/jpeg')
          const out = []
          for (const longEdge of longEdges) {
            const prepared = await prepare(blob, longEdge)
            const ocr = await readImage(pool, prepared)
            out.push({
              longEdge,
              size: [prepared.width, prepared.height],
              lines: ocr.lines
                .slice()
                .sort((a, b) => b.confidence - a.confidence)
                .slice(0, 10)
                .map((l) => l.text + ' [' + Math.round(l.confidence) + ']'),
            })
          }
          return out
        },
        async dispose() {
          await pool?.terminate()
          pool = null
        },
      }
      window.benchReady = true
    </script>
  </body>
</html>
